[putitoutthere]
version = 1

[[package]]
name = "js/cachetta"
kind = "npm"
# Real npm name; the identifier above is js/-prefixed for tag namespacing + uniqueness.
npm = "cachetta"
path = "packages/javascript"
globs = [
  "packages/javascript/src/**",
  "packages/javascript/package.json",
  "packages/javascript/tsconfig.json",
  "packages/javascript/vite.config.ts",
  "packages/javascript/README.md",
  "packages/javascript/CHANGELOG.md",
  "packages/javascript/MIGRATIONS.md",
  "docs/**/*.md",
  "pnpm-lock.yaml",
]
access = "public"

[[package]]
name = "py/cachetta"
kind = "pypi"
# Real PyPI name; the identifier above is py/-prefixed for tag namespacing + uniqueness.
# Must match pyproject.toml [project].name — piot's pre-flight asserts this.
pypi = "cachetta"
build = "setuptools"
path = "packages/python"
globs = [
  "packages/python/src/**",
  "packages/python/pyproject.toml",
  "packages/python/MANIFEST.in",
  "packages/python/README.md",
  "packages/python/CHANGELOG.md",
  "packages/python/MIGRATIONS.md",
  "docs/**/*.md",
]
