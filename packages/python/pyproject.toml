[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cachetta"
version = "0.5.0"
description = "File-based JSON caching for Python"
requires-python = ">= 3.12"
license = "MIT"
readme = "README.md"
authors = [{ name = "Kevin Scott" }]

dependencies = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%H:%M:%S"
log_level = "INFO"

[tool.pytest-watcher]
now = true
clear = true
delay = 0.0
runner = "pytest"
runner_args = []
patterns = ["*.py"]
ignore_patterns = []

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-describe>=3.1.0",
    "pytest-watcher>=0.4.3",
]


[tool.setuptools]
packages = { find = { where = ["src"] } }
package-dir = {"" = "src"}


