[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cachetta"
dynamic = ["version"]
description = "File-based caching for Python"
requires-python = ">= 3.12"
license = "MIT"
readme = "README.md"
authors = [{ name = "Kevin Scott" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/thekevinscott/cachetta"
Repository = "https://github.com/thekevinscott/cachetta"
Documentation = "https://github.com/thekevinscott/cachetta/tree/main/packages/python"
Issues = "https://github.com/thekevinscott/cachetta/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%H:%M:%S"
log_level = "INFO"
markers = [
    "integration: end-to-end tests, excluded from the unit coverage suite (run with -m 'not integration')",
]

[tool.pytest-watcher]
now = true
clear = true
delay = 0.0
runner = "pytest"
runner_args = []
patterns = ["*.py"]
ignore_patterns = []

# ---------------------------------------------------------------------------
# ty — Astral's static type checker. Configured to be as strict as possible
# and enforced by .github/workflows/py-typecheck.yaml. The version is pinned
# in [dependency-groups].dev below so the gate is deterministic across runs.
# ---------------------------------------------------------------------------
[tool.ty.environment]
python-version = "3.12"   # matches requires-python = ">= 3.12"
python-platform = "all"   # check every platform, not just CI's linux

[tool.ty.terminal]
error-on-warning = true   # any rule left at "warn" fails the build

[tool.ty.rules]
# error-on-warning (above) promotes every "warn"-default rule — and any new
# ones that future ty releases add — to a build failure. It cannot reach
# rules that default to "ignore", so each STABLE ignore-default rule is
# raised to "error" by hand below (reconciled against `ty explain rule` for
# the pinned 0.0.44).
#
# Preview rules are deliberately NOT enabled. ty 0.0.44 has no global preview
# switch, so they could only be turned on by hand-listing each unstable rule
# name — exactly the churn this pinned gate exists to avoid. That leaves out
# the one remaining ignore-default rule, `missing-override-decorator`, which
# is preview-only.
division-by-zero = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"
possibly-unresolved-reference = "error"
unsupported-dynamic-base = "error"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "pytest-describe>=3.1.0",
    "pytest-watcher>=0.4.3",
    "ty==0.0.44",
]


[tool.setuptools]
packages = { find = { where = ["src"] } }
package-dir = {"" = "src"}

[tool.setuptools.package-data]
cachetta = ["docs/**/*.md"]

[tool.setuptools_scm]
# Match our `py/cachetta-v{version}` tag prefix. piot overrides this
# at release time via SETUPTOOLS_SCM_PRETEND_VERSION; the regex matters
# only for local dev / CI test paths that don't run through piot.
tag_regex = '^py/cachetta-v(?P<version>.+)$'
fallback_version = "0.0.0+local"


