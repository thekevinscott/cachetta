[project]
name = "flake8-mock-isolation"
version = "0.1.0"
description = "flake8 plugin: unit tests must mock their cross-module collaborators"
requires-python = ">=3.12"
dependencies = ["flake8>=7"]

[project.entry-points."flake8.extension"]
MIS = "flake8_mock_isolation:MockIsolationPlugin"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["flake8_mock_isolation"]
