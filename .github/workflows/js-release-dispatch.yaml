name: JS Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
        default: patch

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[no-release]')
    uses: ./.github/workflows/js-publish.yaml
    with:
      bump_type: ${{ inputs.bump_type || 'patch' }}
    permissions:
      contents: write
      id-token: write
