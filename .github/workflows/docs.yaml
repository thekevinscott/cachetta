name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'packages/javascript/MIGRATIONS.md'
      - 'packages/python/MIGRATIONS.md'
      - '.github/workflows/docs.yaml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync MIGRATIONS.md into docs
        run: |
          set -euo pipefail

          sync_migrations() {
            local pkg="$1"
            local title="$2"
            local order="$3"
            local out="docs/migrations-$pkg.md"

            {
              echo "---"
              echo "title: $title"
              echo "parent: Migrations"
              echo "nav_order: $order"
              echo "---"
              echo
              echo "<!-- AUTO-GENERATED from packages/$pkg/MIGRATIONS.md — do not edit here. -->"
              echo
              cat "packages/$pkg/MIGRATIONS.md"
            } > "$out"
          }

          sync_migrations javascript "TypeScript" 1
          sync_migrations python "Python" 2

      - uses: actions/configure-pages@v5

      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
