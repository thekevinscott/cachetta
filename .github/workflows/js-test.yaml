name: JS Tests

on:
  push:
    branches: [main]
    paths:
      - 'packages/javascript/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/js-test.yaml'
  pull_request:
    paths:
      - 'packages/javascript/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/js-test.yaml'

env:
  FORCE_COLOR: "1"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # diff-cover (patch coverage) needs the base branch history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      # Runs the unit suite with coverage. The `thresholds` in
      # vitest.config.unit.ts require the unit suite to be 100% covered
      # (lines, branches, functions, statements), and the run emits the
      # Cobertura report consumed by the patch-coverage step below.
      - name: Unit tests + coverage (100%, incl. branches)
        working-directory: packages/javascript
        run: pnpm exec vitest run -c vitest.config.unit.ts --coverage

      # Requirement (1): every line added/changed in this PR must be covered
      # by the unit suite. Integration-only coverage does not count, because
      # the report above is from the unit run.
      - name: Patch coverage (changed lines must be 100% unit-covered)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Escape hatch mirroring Skip-Changelog / Skip-Docs: a
          # `Skip-Coverage: <reason>` trailer on any commit in the PR waives
          # this patch-coverage check. Use only for genuinely integration-only
          # code. The coverage floor above is never waived.
          TRAILERS=$(git log --format='%(trailers:only,unfold)' "$BASE_SHA..$HEAD_SHA")
          if echo "$TRAILERS" | grep -qiE '^Skip-Coverage:[[:space:]]*\S'; then
            echo "Skip-Coverage trailer present — skipping patch coverage."
            exit 0
          fi

          git fetch --no-tags --force origin \
            "$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"
          pipx run diff-cover packages/javascript/coverage/cobertura-coverage.xml \
            --compare-branch="origin/$GITHUB_BASE_REF" --fail-under=100

      - name: Integration tests
        working-directory: packages/javascript
        run: pnpm test:integration
