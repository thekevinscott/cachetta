name: Release

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'putitoutthere.toml'
      - '.github/workflows/release.yaml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Plan only, do not publish'
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: plan
        uses: thekevinscott/put-it-out-there@v0
        with:
          command: plan

  build:
    needs: plan
    if: >-
      github.event_name != 'pull_request'
      && fromJSON(needs.plan.outputs.matrix || '[]')[0] != null
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync docs into packages
        run: ./scripts/sync-docs.sh

      - name: Setup Node (npm)
        if: matrix.kind == 'npm'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Setup pnpm (npm)
        if: matrix.kind == 'npm'
        uses: pnpm/action-setup@v4
        with:
          version: latest
      - name: Build npm package
        if: matrix.kind == 'npm'
        run: |
          pnpm install --frozen-lockfile
          cd ${{ matrix.path }}
          pnpm build

      - name: Setup Python (pypi)
        if: matrix.kind == 'pypi'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sdist (setuptools)
        if: matrix.kind == 'pypi' && matrix.build == 'setuptools' && matrix.target == 'sdist'
        run: |
          cd ${{ matrix.path }}
          python -m pip install build
          python -m build --sdist --outdir dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}

  publish:
    needs: [plan, build]
    if: >-
      github.event_name != 'pull_request'
      && fromJSON(needs.plan.outputs.matrix || '[]')[0] != null
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install twine
        run: pip install twine

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: thekevinscott/put-it-out-there@v0
        with:
          command: publish
          dry_run: ${{ inputs.dry_run || 'false' }}
