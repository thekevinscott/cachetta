name: Unit Test Presence

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'scripts/check-unit-test-presence.sh'
      - '.github/workflows/unit-test-presence.yaml'
  pull_request:
    paths:
      - 'packages/**'
      - 'scripts/check-unit-test-presence.sh'
      - '.github/workflows/unit-test-presence.yaml'

jobs:
  check:
    name: Colocated unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every source module must have its own dedicated unit test. This is a
      # structural complement to the coverage gates: it stops a new module from
      # shipping "covered" purely by integration or transitive coverage.
      - name: Every source module has a colocated unit test
        run: bash scripts/check-unit-test-presence.sh
