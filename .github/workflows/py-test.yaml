name: Python Tests

on:
  push:
    branches: [main]
    paths:
      - 'packages/python/**'
      - '.github/workflows/py-test.yaml'
  pull_request:
    paths:
      - 'packages/python/**'
      - '.github/workflows/py-test.yaml'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # diff-cover (patch coverage) needs the base branch history.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        working-directory: packages/python
        run: uv sync

      # Full suite (unit + integration) for correctness, fail-fast + verbose.
      - name: Run tests
        working-directory: packages/python
        run: uv run pytest -x -v

      # Unit tests are colocated as src/cachetta/**/*_test.py. Everything under
      # tests/ is integration BY LOCATION and never feeds this gate — the old
      # `-m "not integration"` marker was an unreliable record (integration
      # tests that forgot the mark leaked into the unit measurement). The unit
      # suite must be 100% covered incl. branches (--cov-branch); the XML report
      # feeds the patch-coverage step below.
      - name: Unit coverage (100%, incl. branches)
        working-directory: packages/python
        run: uv run pytest src/cachetta --cov=cachetta --cov-branch --cov-report=xml --cov-fail-under=100

      # Requirement (1): every line added/changed in this PR must be covered
      # by the unit suite. Integration-only coverage does not count, because
      # the report above is from the unit run.
      - name: Patch coverage (changed lines must be 100% unit-covered)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Escape hatch mirroring Skip-Changelog / Skip-Docs: a
          # `Skip-Coverage: <reason>` trailer on any commit in the PR waives
          # this patch-coverage check. Use only for genuinely integration-only
          # code. The coverage floor above is never waived.
          TRAILERS=$(git log --format='%(trailers:only,unfold)' "$BASE_SHA..$HEAD_SHA")
          if echo "$TRAILERS" | grep -qiE '^Skip-Coverage:[[:space:]]*\S'; then
            echo "Skip-Coverage trailer present — skipping patch coverage."
            exit 0
          fi

          git fetch --no-tags --force origin \
            "$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"
          uvx diff-cover packages/python/coverage.xml \
            --compare-branch="origin/$GITHUB_BASE_REF" --fail-under=100
